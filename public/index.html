<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account product query</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="wrap">
      <header class="site-header" role="banner">
        <a
          class="brand-link"
          href="https://www.braze.com"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img
            class="brand-logo"
            src="braze-logo.png"
            alt="Braze"
            width="200"
            height="64"
          />
        </a>
      </header>
      <h1>Customer Entitlements Tracker</h1>
      <p class="lede">
        This app can be used to track the entitlements of a customer as per their most recent order form and can identify which entitlements are not currently being used by the customer.
      </p>

      <form id="query-form" class="card">
        <label>
          <span>Email Address</span>
          <input
            type="email"
            name="email"
            autocomplete="username"
            required
            placeholder="you@company.com"
          />
        </label>
        <label>
          <span>Customer Name</span>
          <input
            type="text"
            name="customerName"
            required
            placeholder="Exact account name"
          />
        </label>
        <button type="submit" id="submit-btn">Run query</button>
      </form>

      <div id="status" class="status" hidden></div>

      <section id="results-section" class="results" hidden>
        <h2>Results</h2>
        <div id="results-filters" class="results-filters" hidden>
          <span class="results-filters-title">Filter rows</span>
          <div class="results-filters-row">
            <div class="results-filters-group" data-filter-for="IS_PURCHASED">
              <span class="results-filters-heading">IS_PURCHASED</span>
              <label class="results-filters-option">
                <input
                  type="checkbox"
                  data-filter-field="IS_PURCHASED"
                  data-filter-value="TRUE"
                />
                TRUE
              </label>
              <label class="results-filters-option">
                <input
                  type="checkbox"
                  data-filter-field="IS_PURCHASED"
                  data-filter-value="FALSE"
                />
                FALSE
              </label>
            </div>
            <div class="results-filters-group" data-filter-for="IS_USING">
              <span class="results-filters-heading">IS_USING</span>
              <label class="results-filters-option">
                <input
                  type="checkbox"
                  data-filter-field="IS_USING"
                  data-filter-value="TRUE"
                />
                TRUE
              </label>
              <label class="results-filters-option">
                <input
                  type="checkbox"
                  data-filter-field="IS_USING"
                  data-filter-value="FALSE"
                />
                FALSE
              </label>
            </div>
          </div>
        </div>
        <div class="table-wrap">
          <table id="results-table">
            <thead id="results-head"></thead>
            <tbody id="results-body"></tbody>
          </table>
        </div>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
